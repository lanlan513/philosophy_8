<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171008">
  <title>箴言显影机</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="masthead">
      <p class="masthead-kicker">THE APHORISM DARKROOM</p>
      <h1 class="masthead-title">箴言显影机</h1>
      <p class="masthead-sub">把情绪放上滑轨，等一段文字在暗房里慢慢显影。</p>
    </header>

    <!-- 黄铜滑块：拖动选择情绪 -->
    <section class="slider-panel" aria-label="情绪选择">
      <div
        class="slider"
        id="slider"
        role="slider"
        tabindex="0"
        aria-label="选择情绪"
        aria-valuemin="0"
        aria-valuemax="4"
        aria-valuenow="2"
        aria-valuetext="孤独"
      >
        <div class="slider-rail">
          <div class="slider-fill" id="sliderFill"></div>
          <div class="slider-notches" id="sliderNotches" aria-hidden="true"></div>
          <div class="slider-thumb" id="sliderThumb">
            <span class="slider-thumb-grip"></span>
          </div>
        </div>
        <ul class="slider-labels" id="sliderLabels"></ul>
      </div>
      <p class="slider-hint">拖动黄铜滑块，或点击一种情绪</p>
    </section>

    <!-- 显影台 -->
    <section class="stage is-idle" id="stage" aria-live="polite">
      <figure class="plate" id="plate">
        <img class="plate-img" id="plateImg" alt="" draggable="false">
        <canvas class="plate-grain" id="grainCanvas" aria-hidden="true"></canvas>
        <div class="plate-fallback" id="plateFallback" hidden>
          <span>底片未能送达，暗房用一盏灯代替。</span>
        </div>
        <figcaption class="plate-caption" id="plateCaption"></figcaption>
      </figure>

      <blockquote class="quote" id="quote"></blockquote>

      <p class="meta" id="meta">
        <span class="meta-philosopher" id="philosopher"></span>
        <span class="meta-year" id="year"></span>
      </p>

      <p class="response" id="response"></p>

      <p class="stage-empty" id="stageEmpty" hidden>
        今日暗房暂时没有这种情绪的底片。<br>换一种情绪，或明天再来。
      </p>

      <p class="stage-idle-hint" id="idleHint">暗房就绪。拨动滑块，开始第一次显影。</p>
    </section>

    <!-- 操作 -->
    <section class="actions" aria-label="操作">
      <button class="btn btn-primary" id="btnSave" disabled>保存这次显影</button>
      <button class="btn" id="btnCard" disabled>生成思想卡片</button>
      <button class="btn btn-ghost" id="btnAgain" disabled>再显影一次</button>
    </section>

    <footer class="colophon">
      <span id="versionTag">内容版本 · 读取中</span>
      <span class="colophon-dot">·</span>
      <span>引文只被呈现，不被裁决</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="text-align:center;padding:2rem;">这台机器需要 JavaScript 才能运转。</p>
  </noscript>

  <script src="app.js" defer></script>
</body>
</html>
